Q3.1. In the Ideate stage of Design Thinking, what is the primary role of defining the goal?

    A) To select the best solution from the generated ideas.
    
    B) To brainstorm potential solutions to the identified problem.
    
    C) To evaluate the feasibility of implementing the solutions.
    
    D) To set a clear direction and focus for the ideation process.
    
    E) To conduct user testing to validate the ideas.
    
Correct Answer: D) To set a clear direction and focus for the ideation process.

Explanation: Defining the goal in the Ideate stage is crucial for providing a clear direction and focus for the brainstorming and idea generation process. It helps participants understand the problem space and the specific objectives they aim to achieve through ideation, enabling them to generate relevant and effective solutions.

-------------------------------------------------------------------------------------------------------------------------------

Q3.2. How does defining the goal contribute to the Ideate stage in Design Thinking?

    A) It limits creativity and innovation by providing strict guidelines.
    
    B) It encourages participants to explore a wide range of ideas without constraints.
    
    C) It helps in selecting the most feasible solution among the generated ideas.
    
    D) It ensures that participants focus only on incremental improvements rather than radical innovations.
    
    E) It restricts the brainstorming process to predetermined solutions.
    
Correct Answer: B) It encourages participants to explore a wide range of ideas without constraints.

Explanation: Defining the goal in the Ideate stage does not impose strict guidelines but rather provides a clear direction for creativity to flourish. It encourages participants to explore diverse ideas and solutions relevant to the defined problem, fostering a culture of innovation and exploration.

-------------------------------------------------------------------------------------------------------------------------------

Q3.3. What is the significance of setting a well-defined goal in the Ideate stage of Design Thinking?

    A) It ensures that the solution aligns with the organization's budget constraints.
    
    B) It minimizes the need for collaboration among team members.
    
    C) It guides participants in generating ideas that directly address the identified problem.
    
    D) It limits the scope of ideation to a narrow range of possibilities.
    
    E) It accelerates the process of prototype development.
    
Correct Answer: C) It guides participants in generating ideas that directly address the identified problem.

Explanation: A well-defined goal provides clarity and focus, guiding participants to generate ideas that are relevant and effective in addressing the identified problem or challenge. It ensures that ideation efforts are directed towards solving the right problem and achieving the desired outcomes.

-------------------------------------------------------------------------------------------------------------------------------

Q3.4. How does defining the goal in the Ideate stage impact the quality of generated ideas?

    A) It leads to the repetition of previously failed solutions.
    
    B) It encourages participants to focus solely on quantity rather than quality.
    
    C) It fosters a deeper understanding of the problem, leading to more relevant and innovative ideas.
    
    D) It restricts participants to conventional and conservative solutions.
    
    E) It increases the likelihood of biases influencing the ideation process.
    
Correct Answer: C) It fosters a deeper understanding of the problem, leading to more relevant and innovative ideas.

Explanation: Defining the goal helps participants gain a deeper understanding of the problem space, enabling them to generate ideas that are more relevant, innovative, and effective in addressing the identified challenge. By aligning ideation efforts with the defined goal, the quality of generated ideas is significantly enhanced.

-------------------------------------------------------------------------------------------------------------------------------

Q3.5. What role does a well-defined goal play in the Ideate stage of Design Thinking?

    A) It eliminates the need for brainstorming and idea generation.
    
    B) It ensures that participants focus solely on improving existing solutions rather than exploring new ones.
    
    C) It guides participants in prioritizing ideas based on their complexity.
    
    D) It empowers participants to explore diverse and creative solutions relevant to the identified problem.
    
    E) It hinders collaboration among team members by imposing rigid constraints.
    
Correct Answer: D) It empowers participants to explore diverse and creative solutions relevant to the identified problem.

Explanation: A well-defined goal provides participants with the freedom and guidance to explore diverse and creative solutions that directly address the identified problem or challenge. It empowers them to think innovatively and generate ideas that can lead to breakthrough innovations and solutions.

Q3.6. In the Ideate stage of Design Thinking, what role does "Input" play?

    A) Input refers to the information gathered from user testing sessions.
    
    B) Input involves the materials and resources used to create prototypes.
    
    C) Input consists of insights, inspiration, and knowledge that inform the ideation process.
    
    D) Input refers to the final selection of ideas for implementation.
    
    E) Input focuses on the evaluation of the feasibility of generated ideas.
    
Correct Answer: C) Input consists of insights, inspiration, and knowledge that inform the ideation process.

Explanation: In the Ideate stage, "Input" refers to the diverse range of insights, inspiration, and knowledge gathered from various sources such as user research, observations, interviews, and secondary research. This input serves as the foundation for generating creative ideas and solutions that address the identified problem or challenge effectively.

-------------------------------------------------------------------------------------------------------------------------------

Q3.7. How does "Input" contribute to the Ideate stage in Design Thinking?

    A) It limits creativity by providing predetermined solutions.
    
    B) It ensures that participants focus solely on incremental improvements rather than radical innovations.
    
    C) It serves as a source of inspiration and knowledge that stimulates creative thinking.
    
    D) It accelerates the process of prototype development by providing ready-made designs.
    
    E) It restricts ideation efforts to a narrow range of possibilities.
    
Correct Answer: C) It serves as a source of inspiration and knowledge that stimulates creative thinking.

Explanation: Input in the Ideate stage serves as a catalyst for creative thinking by providing participants with insights, inspiration, and knowledge from various sources. It encourages them to explore diverse perspectives and generate innovative ideas that can lead to breakthrough solutions to the identified problem or challenge.

-------------------------------------------------------------------------------------------------------------------------------

Q3.8. What types of information are typically included in the "Input" during the Ideate stage?

    A) Detailed financial projections for potential solutions.
    
    B) User feedback and preferences collected from surveys.
    
    C) Technical specifications of existing products in the market.
    
    D) Case studies of successful design projects from other industries.
    
    E) Inspirational quotes from famous designers.
    
Correct Answer: B) User feedback and preferences collected from surveys.

Explanation: Input in the Ideate stage often includes user feedback and preferences obtained through surveys, interviews, observations, and other user research methods. This information provides valuable insights into user needs, desires, pain points, and preferences, which can inspire the generation of relevant and user-centered ideas and solutions.

-------------------------------------------------------------------------------------------------------------------------------

Q3.9. How does incorporating user feedback into the "Input" enhance the Ideate stage?

    A) It leads to the replication of existing solutions without innovation.

    C) It ensures that ideation efforts are aligned with the actual needs and preferences of the users.
    
    D) It limits creativity by imposing rigid constraints on the ideation process.
    
    E) It accelerates the process of prototype development by providing predefined design specifications.
    
Correct Answer: C) It ensures that ideation efforts are aligned with the actual needs and preferences of the users.

Explanation: Incorporating user feedback into the Input ensures that ideation efforts are grounded in the actual needs, preferences, and experiences of the users. This alignment enhances the relevance and effectiveness of generated ideas, leading to solutions that are more likely to resonate with and meet the needs of the target users.

-------------------------------------------------------------------------------------------------------------------------------

Q3.10. Why is it essential to gather diverse sources of information for the "Input" in the Ideate stage?

    E) To accelerate the process of idea generation by providing predefined solutions.
    
Correct Answer: C) To ensure that participants are exposed to a variety of insights and perspectives.

Explanation: Gathering diverse sources of information for the Input ensures that participants are exposed to a variety of insights, perspectives, and inspirations. This exposure stimulates creative thinking and enables participants to generate a wider range of ideas and solutions that may not have been considered otherwise. It fosters innovation and encourages the exploration of unconventional approaches to problem-solving.

Q3.21. What are the primary components of the Ideate stage in Design Thinking?

    A) Problem Definition, Solution Evaluation, Prototype Development
    
    B) Brainstorming, Concept Generation, Idea Selection
    
    C) Research Analysis, User Testing, Iterative Design
    
    D) Problem Validation, User Interviews, Implementation Planning
    
    E) Concept Validation, Idea Implementation, Feedback Collection
    
Correct Answer: B) Brainstorming, Concept Generation, Idea Selection

Explanation: The primary components of the Ideate stage in Design Thinking include brainstorming, where diverse ideas are generated; concept generation, where these ideas are refined and developed into concepts; and idea selection, where the most promising concepts are chosen for further development or implementation.

-------------------------------------------------------------------------------------------------------------------------------

Q3.22. What is the purpose of brainstorming in the Ideate stage of Design Thinking?

    D) To define the problem statement and objectives.
    
    E) To prioritize ideas based on their feasibility and impact.

Explanation: Brainstorming in the Ideate stage is intended to generate a diverse range of ideas without judgment or evaluation. It encourages participants to think creatively and freely, exploring a wide range of possibilities and potential solutions to the identified problem or challenge.

Q3.33. What distinguishes brainstorming from other ideation techniques in the Ideate stage of Design Thinking?

    C) Brainstorming encourages creativity and idea generation, while other techniques emphasize evaluation and selection.

<script>
    let questionBank = [];

    // Fungsi parsing raw data teks
    function parseRawData() {
        const rawText = document.getElementById('rawData').value;
        const blocks = rawText.split(/\n(?=Q\d+\.\d+\.)/); 
        
        blocks.forEach(block => {
            if (!block.includes('Explanation:')) return; 
            
            let text = block.trim();
            text = text.replace(/[-=]{5,}/g, '').trim();
            
            let qMatch = text.match(/^(Q\d+\.\d+\.\s*.*?)(?=\n[ \t]*[a-eA-E]\))/s);
            let questionText = qMatch ? qMatch[1].trim() : "";
            
            let options = [];
            let optRegex = /^[ \t]*([a-eA-E]\)[ \t]*.*)/gm;
            let optMatch;
            while ((optMatch = optRegex.exec(text)) !== null) {
                options.push(optMatch[1].trim());
            }
            
            let ansMatch = text.match(/Correct Answer:\s*([a-eA-E]\).*)/i);
            let answerText = ansMatch ? ansMatch[1].trim() : "";
            
            let expMatch = text.match(/Explanation:\s*([\s\S]*)/i);
            let explanationText = expMatch ? expMatch[1].trim() : "";
            
            if (questionText && options.length > 0 && answerText) {
                questionBank.push({
                    question: questionText,
                    options: options,
                    answer: answerText,
                    explanation: explanationText
                });
            }
        });
        
        console.log("Berhasil memuat " + questionBank.length + " soal.");
        renderSearchList(questionBank);
    }

        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Fungsi Pencarian
    function searchQuestions() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = questionBank.filter(q => 
            q.question.toLowerCase().includes(query) || 
            q.options.some(opt => opt.toLowerCase().includes(query)) ||
            q.explanation.toLowerCase().includes(query) ||
            q.answer.toLowerCase().includes(query)
        );
        renderSearchList(filtered);
    }

    function renderSearchList(list) {
        const container = document.getElementById('searchResults');
        const count = document.getElementById('searchCount');
        container.innerHTML = '';
        count.innerHTML = `Ditemukan: <b>${list.length}</b> soal`;

        list.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            let optsHTML = item.options.map(o => `<li>${o}</li>`).join('');
            card.innerHTML = `
                <div class="question-title">${item.question}</div>
                <ul class="options" style="margin-left: 20px;">${optsHTML}</ul>
                <div style="color: green; font-weight: bold; margin-bottom: 5px;">${item.answer}</div>
                <div style="font-size: 14px; background: #eee; padding: 10px; border-radius: 4px;"><b>Explanation:</b> ${item.explanation}</div>
            `;
            container.appendChild(card);
        });
    }

    // LOGIKA KUIS SLIDE-BY-SLIDE
    function startQuiz() {
        let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
        currentQuiz = shuffled.slice(0, 170);
        currentQuestionIndex = 0;
        currentScore = 0;
        
        document.getElementById('quizIntro').style.display = 'none';
        document.getElementById('scoreBoard').style.display = 'none';
        
        renderQuestion(currentQuestionIndex);
    }

    function renderQuestion(index) {
        const container = document.getElementById('quizContainer');
        container.innerHTML = ''; 
        
        // Cek jika kuis sudah selesai
        if (index >= currentQuiz.length) {
            showFinalScore();
            return;
        }

        let item = currentQuiz[index];
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let optsHTML = item.options.map((o, i) => {
            let val = o.charAt(0).toLowerCase();
            let textOption = o.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
            return `
                <li class="option-item" id="opt-${i}" onclick="checkAnswer('${val}', ${i})">
                    ${textOption}
                </li>
            `;
        }).join('');
        
        card.innerHTML = `
            <div style="font-size: 14px; color: #6c757d; margin-bottom: 15px; font-weight: bold;">
                Soal ${index + 1} dari ${currentQuiz.length}
            </div>
            <div class="question-title">${item.question}</div>
            <ul class="options">${optsHTML}</ul>
            
            <div class="explanation" id="explanationBox">
                <div style="color: var(--primary); font-weight: bold; margin-bottom: 8px;">
                    Jawaban Benar: ${item.answer}
                </div>
                <div>${item.explanation}</div>
            </div>
            
            <button class="btn-primary" id="nextBtn" style="display:none; padding: 15px; font-weight:bold;" onclick="nextQuestion()">Selanjutnya &raquo;</button>
        `;
        
        container.appendChild(card);
        window.scrollTo(0, 0);
    }

    function checkAnswer(selectedVal, optIndex) {
        let item = currentQuiz[currentQuestionIndex];
        let correctVal = item.answer.charAt(0).toLowerCase();
        let isAnswered = document.getElementById('nextBtn').style.display === 'block';
        
        // Kunci jawaban jika sudah diklik
        if (isAnswered) return;

        // Evaluasi semua opsi untuk pewarnaan
        item.options.forEach((o, i) => {
            let val = o.charAt(0).toLowerCase();
            let li = document.getElementById(`opt-${i}`);
            li.style.cursor = 'default'; // matikan hover cursor
            
            if (val === correctVal) {
                // Warna Hijau untuk jawaban yang benar
                li.style.backgroundColor = "var(--correct)";
                li.style.borderColor = "var(--correct-border)";
            } else if (val === selectedVal && val !== correctVal) {
                // Warna Merah kalau salah pencet
                li.style.backgroundColor = "var(--wrong)";
                li.style.borderColor = "var(--wrong-border)";
            }
        });

        // Tambah nilai jika benar
        if (selectedVal === correctVal) {
            currentScore++;
        }

        // Tampilkan penjelasan dan tombol next
        document.getElementById('explanationBox').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        renderQuestion(currentQuestionIndex);
    }

    function showFinalScore() {
        const finalScore = Math.round((currentScore / currentQuiz.length) * 100);
        const scoreBoard = document.getElementById('scoreBoard');
        
        scoreBoard.style.display = 'block';
        scoreBoard.innerHTML = `
            🎉 Latihan Selesai! 🎉<br><br>
            Nilai Akhir Kamu: <span style="font-size: 38px; color: var(--primary);">${finalScore}</span><br>
            <span style="font-size:16px; font-weight: normal;">(Berhasil menjawab benar ${currentScore} dari ${currentQuiz.length} soal)</span>
        `;
        
        document.getElementById('quizIntro').style.display = 'block';
        document.getElementById('startQuizBtn').innerText = 'Ulangi Simulasi UTS';
        window.scrollTo(0, 0);
    }

    window.onload = parseRawData;
</script>
</body>
</html>
